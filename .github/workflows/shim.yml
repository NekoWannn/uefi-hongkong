name: shim

# Wrap the UEFI firmware volume in the container this device's ABL has already
# accepted in practice: our own bare-metal shim as the kernel payload, the FD
# appended at the same offset the XNU route used.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu device-tree-compiler

      - name: Build the shim
        run: |
          set -eux
          cd overlay/shim
          mkdir -p out
          CC=aarch64-linux-gnu-gcc
          FLAGS="-O2 -ffreestanding -nostdlib -fno-pic -mgeneral-regs-only -mstrict-align -fno-stack-protector -Wall -Wextra"
          for f in start.S uefi.c console.c stubs.c extra.c; do
            $CC $FLAGS -c $f -o out/${f%.*}.o
          done
          $CC $FLAGS -static -T shim.ld -Wl,--build-id=none \
            -Wl,--no-warn-rwx-segments -Wl,-N out/start.o out/uefi.o out/console.o out/stubs.o out/extra.o \
            -o out/shim.elf
          aarch64-linux-gnu-objcopy -O binary out/shim.elf out/shim.bin
          size=$(aarch64-linux-gnu-nm out/shim.elf | awk '$3=="_end"{print strtonum("0x"$1)}')
          test -n "$size"
          truncate -s "$size" out/shim.bin
          ls -l out/shim.bin

      - name: Assemble the image
        run: |
          set -eux
          cd overlay/shim
          python3 mkimg.py
          ls -l out/*.img

      - uses: actions/upload-artifact@v4
        with:
          name: hongkong-shim
          path: |
            overlay/shim/out/*.img
            overlay/shim/out/shim.bin
          if-no-files-found: error
