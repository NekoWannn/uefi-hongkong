name: uefi

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout our device overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Fetch upstream uefi-sheng and the UniXNU umbrella
        run: |
          set -eux
          git clone --depth 1 -b sheng https://github.com/UniXNU/uefi-sheng.git up
          # The umbrella carries the UEFI packages the .dsc names
          # (UniXNUPkg, DarwinBootPkg, ...); they live in driver submodules and
          # are installed into package/ by the umbrella's own tooling.
          git clone --recursive --depth 1 --shallow-submodules \
            https://github.com/UniXNU/UniXNU.git umbrella
          ls umbrella
          ls umbrella/drivers | head -30
          cd up
          git submodule update --init --depth 1 \
            Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicium-ACPI || true
          # Binaries is a vendor-driver cache that is not distributed; the
          # HONGKONG_VENDOR_HW=0 build references nothing under it, so keep an
          # empty directory in place instead of failing submodule setup.
          mkdir -p Binaries

      - name: Expose the umbrella driver packages
        run: |
          set -eux
          # Every driver repo ships its own <Name>Pkg directory; the platform
          # .dsc resolves them through UNIXNU_ROOT/package, which only contains
          # UniXNUPkg in the checkout.
          for d in umbrella/drivers/*/; do
            for p in "$d"*Pkg; do
              [ -d "$p" ] || continue
              name=$(basename "$p")
              [ -e "umbrella/package/$name" ] || ln -s "../drivers/$(basename "$d")/$name" "umbrella/package/$name"
            done
          done
          ls -l umbrella/package
          test -f umbrella/package/DarwinBootPkg/Driver/DarwinBoot.inf

      - name: Overlay the hongkong packages
        run: |
          set -eux
          cp -r overlay/Platforms/Xiaomi/hongkongPkg up/Platforms/Xiaomi/
          cp -r overlay/Silicon/Qualcomm/MailiPkg up/Silicon/Qualcomm/
          cp overlay/Resources/Configs/hongkong.toml up/Resources/Configs/
          ls up/Platforms/Xiaomi/hongkongPkg
          ls up/Silicon/Qualcomm/MailiPkg

      - name: Install build tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm \
            gcc-aarch64-linux-gnu clang lld llvm mono-complete ca-certificates-mono \
            python3 python3-pip
          # Ubuntu ships the LLVM tools with a version suffix; BootShim's
          # Makefile calls the unversioned names, so provide them.
          for tool in llvm-objcopy llvm-objdump llvm-readelf; do
            if ! command -v "$tool" >/dev/null; then
              found="$(command -v "${tool}-18" || command -v "${tool}-17" || command -v "${tool}-19" || true)"
              test -n "$found"
              sudo ln -sf "$found" "/usr/local/bin/$tool"
            fi
            command -v "$tool"
          done
          python3 -m pip install --upgrade pip
          python3 -m pip install -r up/pip-requirements.txt
          python3 -m pip install edk2-pytool-extensions edk2-pytool-library

      - name: Show the build driver CLI
        run: |
          cd up
          python3 Platforms/Xiaomi/hongkongPkg/DeviceBuild.py --help || true

      - name: Register hongkong as an active device
        run: |
          set -eux
          cd up
          # build_uefi.py takes the device name and reads Resources/Configs/
          # hongkong.toml for the FD window; Status.md only drives the
          # "build every active device" script, so add an entry for the record.
          if ! grep -q 'hongkong' Status.md; then
            printf '\n**State:** Active\n**Codename:** hongkong\n**Models:** 1\n' >> Status.md
          fi
          grep -A 2 'Codename:\*\* hongkong' Status.md

      - name: Build the hongkong firmware volume
        env:
          UNIXNU_ROOT: ${{ github.workspace }}/umbrella
        run: |
          set -eux
          cd up
          ls Resources/Configs/hongkong.toml
          ./build_uefi.py -d hongkong -r DEBUG || {
            echo "--- build logs ---"
            find Build -name '*.log' -print -exec tail -n 100 {} \; 2>/dev/null || true
            exit 1
          }

      - name: Report what was produced
        run: |
          set -eux
          cd up
          ls -l Mu-* 2>/dev/null || true
          find Build -maxdepth 4 -type f \( -name '*.fd' -o -name '*.Fv' \) -printf '%p %s\n' 2>/dev/null || true

      - name: Upload firmware volume and boot image
        uses: actions/upload-artifact@v4
        with:
          name: hongkong-uefi
          path: |
            up/Mu-*
            up/Build/hongkongPkg/**/*.fd
          if-no-files-found: warn
          retention-days: 30
