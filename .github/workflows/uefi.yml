name: uefi

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fd:
    name: firmware volume
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: overlay

      - name: Fetch upstream uefi-sheng and the UniXNU umbrella
        run: |
          set -eux
          git clone --depth 1 -b sheng https://github.com/UniXNU/uefi-sheng.git up
          git clone --recursive --depth 1 --shallow-submodules \
            https://github.com/UniXNU/UniXNU.git umbrella
          cd up
          # --recursive is needed: Mu_Basecore carries nested submodules such as
          # MipiSysTLib/mipisyst, and MdePkg.dec lists their include directory,
          # so a shallow non-recursive checkout fails the build with
          # "File/directory not found in workspace".
          git submodule update --init --recursive --depth 1 \
            Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicium-ACPI
          mkdir -p Binaries

      - name: Expose the umbrella driver packages
        run: |
          set -eux
          for d in umbrella/drivers/*/; do
            for p in "$d"*Pkg; do
              [ -d "$p" ] || continue
              name=$(basename "$p")
              [ -e "umbrella/package/$name" ] || ln -s "../drivers/$(basename "$d")/$name" "umbrella/package/$name"
            done
          done
          test -f umbrella/package/DarwinBootPkg/Driver/DarwinBoot.inf

      - name: Apply local patches
        run: |
          set -eux
          shopt -s nullglob
          # This repository is checked out under overlay/, not at the workspace
          # root, so the patches live there. Every patch under it is applied in
          # name order against the upstream tree; paths inside a patch are
          # relative to that tree's root, which makes adding or dropping a change
          # a matter of adding or deleting one file.
          n=0
          for p in "$GITHUB_WORKSPACE"/overlay/patches/*.patch; do
            echo "applying $(basename "$p")"
            # patch rather than git apply: the upstream tree moves and a pure
            # line-number shift is not a reason to fail. --forward keeps it from
            # applying a patch twice.
            patch -p1 -d up --forward --fuzz=3 < "$p"
            n=$((n + 1))
          done
          echo "applied $n patch(es)"

      - name: Overlay the hongkong packages
        run: |
          set -eux
          cp -r overlay/Platforms/Xiaomi/hongkongPkg up/Platforms/Xiaomi/
          cp -r overlay/Silicon/Qualcomm/MailiPkg up/Silicon/Qualcomm/
          cp overlay/Resources/Configs/hongkong.toml up/Resources/Configs/
          mkdir -p up/Resources/DTBs
          cp -v overlay/Resources/DTBs/*.dtb up/Resources/DTBs/

      - name: Install build tools
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl nasm \
            gcc-aarch64-linux-gnu clang lld llvm mono-complete ca-certificates-mono \
            device-tree-compiler python3 python3-pip
          for tool in llvm-objcopy llvm-objdump llvm-readelf; do
            if ! command -v "$tool" >/dev/null; then
              found="$(command -v "${tool}-18" || command -v "${tool}-17" || command -v "${tool}-19" || true)"
              test -n "$found"
              sudo ln -sf "$found" "/usr/local/bin/$tool"
            fi
          done
          python3 -m pip install --upgrade pip
          python3 -m pip install -r up/pip-requirements.txt
          python3 -m pip install edk2-pytool-extensions edk2-pytool-library

      - name: Add the splash reservation to the appended DTB
        run: |
          set -eux
          python3 overlay/tools/add-splash.py up/Resources/DTBs/hongkong.dtb

      - name: Register hongkong as an active device
        run: |
          set -eux
          cd up
          if ! grep -q 'hongkong' Status.md; then
            printf '\n**State:** Active\n**Codename:** hongkong\n**Models:** 1\n' >> Status.md
          fi

      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          # EDK2 rebuilds only what changed when its build tree survives, so the
          # object files and the generated makefiles are worth carrying between
          # runs. The key includes the run id so a fresh cache is saved every
          # time, while restore-keys pick the most recent one for the same
          # platform sources.
          path: |
            up/Build
            up/Conf
          key: edk2-${{ hashFiles('overlay/Platforms/**', 'overlay/patches/**') }}-${{ github.run_id }}
          restore-keys: |
            edk2-${{ hashFiles('overlay/Platforms/**', 'overlay/patches/**') }}-
            edk2-

      - name: Build the hongkong firmware volume
        env:
          UNIXNU_ROOT: ${{ github.workspace }}/umbrella
        run: |
          set -eux
          cd up
          ./build_uefi.py -d hongkong -r DEBUG || {
            find Build -name '*.log' -print -exec tail -n 100 {} \; 2>/dev/null || true
            exit 1
          }

      - name: Collect PCD token numbers
        run: |
          set -eux
          # Every PCD gets a _PCD_TOKEN_<name> define in its module's AutoGen.h.
          # Harvest them so a token number in a crash report can be turned back
          # into a PCD name without rebuilding anything.
          grep -rhoE '_PCD_TOKEN_[A-Za-z0-9_]+ +[0-9]+' up/Build \
            | sort -u > pcd-tokens.txt
          wc -l pcd-tokens.txt
          grep -E ' 5$' pcd-tokens.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: pcd-tokens
          path: pcd-tokens.txt
          if-no-files-found: error

      - name: Collect the firmware volume
        run: |
          set -eux
          cd up
          fd=$(find Build -name 'SILICIUM_UEFI.fd' | head -1)
          test -n "$fd"
          mkdir -p "${{ github.workspace }}/out"
          cp -v "$fd" "${{ github.workspace }}/out/SILICIUM_UEFI.fd"
          bs=$(find . -name BootShim.bin | head -1)
          test -n "$bs"
          cp -v "$bs" "${{ github.workspace }}/out/BootShim.bin"
          ls -l "${{ github.workspace }}/out"

      - uses: actions/upload-artifact@v4
        with:
          name: hongkong-fd
          path: |
            out/SILICIUM_UEFI.fd
            out/BootShim.bin
          if-no-files-found: error
          retention-days: 30

  image:
    name: boot image
    needs: fd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Take the firmware volume from the previous job
        uses: actions/download-artifact@v4
        with:
          name: hongkong-fd
          path: shim

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu nodejs

      - name: Build the shim
        run: |
          set -eux
          cd shim
          mkdir -p out
          ls -l BootShim.bin SILICIUM_UEFI.fd
          CC=aarch64-linux-gnu-gcc
          FLAGS="-O2 -ffreestanding -nostdlib -fno-pic -mgeneral-regs-only -mstrict-align -fno-stack-protector -Wall -Wextra"
          for f in start.S uefi.c console.c stubs.c extra.c; do
            $CC $FLAGS -c $f -o out/${f%.*}.o
          done
          $CC $FLAGS -static -T shim.ld -Wl,--build-id=none \
            -Wl,--no-warn-rwx-segments -Wl,-N \
            out/start.o out/uefi.o out/console.o out/stubs.o out/extra.o -o out/shim.elf
          aarch64-linux-gnu-objcopy -O binary out/shim.elf out/shim.bin
          size=$(aarch64-linux-gnu-nm out/shim.elf | awk '$3=="_end"{print strtonum("0x"$1)}')
          truncate -s "$size" out/shim.bin
          ls -l out/shim.bin SILICIUM_UEFI.fd

      - name: Assemble the image
        run: |
          set -eux
          cd shim
          # Our own shim with the volume at 0x2F000: the concatenated BootShim
          # layout that mkimg_bootshim.py produces was never accepted by ABL.
          python3 mkimg.py
          ls -l out/*.img

      - uses: actions/upload-artifact@v4
        with:
          name: hongkong-uefi
          path: |
            shim/out/*.img
            shim/out/shim.bin
          if-no-files-found: error
          retention-days: 30
